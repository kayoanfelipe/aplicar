  .badge { color: var(--gold); font-weight: 600; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }

  /* Entrada */
  .login { max-width: 400px; margin: 0 auto; padding: 18vh 24px 40px; display: none; flex-direction: column; }
  .login.on { display: flex; }
  .login h1 { font-weight: 600; font-size: 30px; letter-spacing: -0.5px; margin: 22px 0 8px; }
  .login p { color: var(--ink-2); font-size: 14.5px; line-height: 1.6; margin: 0 0 28px; }
  .input { border: 1px solid var(--line); border-radius: 16px; display: flex; }
  .input:focus-within { border-color: var(--ink); }
  .input input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; padding: 16px 18px; min-width: 0; color: var(--ink); }
  .btn { appearance: none; border: 0; cursor: pointer; background: var(--dark); color: var(--on-dark); font-size: 15px; font-weight: 500; border-radius: 35px; padding: 16px 26px; margin-top: 16px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .msg { color: var(--error); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .link { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 18px; align-self: flex-start; }
  .link:hover { color: var(--ink); }

  /* Quadro */
  .app { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  .app.on { display: flex; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: max(18px, env(safe-area-inset-top)) 24px 14px; }
  .top h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; margin: 0; }
  .top .right { display: flex; gap: 18px; align-items: center; }
  .board { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(250px, 1fr)); gap: 14px; padding: 6px 24px max(24px, env(safe-area-inset-bottom)); overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 24px; }
  @media (max-width: 700px) { .board { grid-template-columns: repeat(5, 84%); padding: 6px 16px 24px; scroll-padding: 16px; gap: 10px; } .top { padding-left: 16px; padding-right: 16px; } }
  .col { background: var(--col); border-radius: 20px; display: flex; flex-direction: column; min-height: 0; scroll-snap-align: start; transition: box-shadow .15s; }
  .col.drop { box-shadow: inset 0 0 0 2px var(--ink); }
  .col header { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 16px 10px; }
  .col h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .col .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cards { flex: 1; overflow-y: auto; padding: 2px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--empty); font-size: 12.5px; text-align: center; padding: 18px 0; }
  .card { appearance: none; text-align: left; width: 100%; cursor: pointer; background: var(--card); border: 1px solid transparent; border-radius: 14px; color: var(--ink); padding: 14px 15px; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: border-color .15s, transform .1s; }
  .card:hover { border-color: var(--hover); }
  .card:active { transform: scale(.99); }
  .card.dragging { opacity: .4; }
  .card .name { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .card .when { font-size: 11.5px; font-weight: 400; color: var(--muted); white-space: nowrap; }
  .card .tag { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 500; color: var(--ink-2); background: var(--tag); border: 0; border-radius: 20px; padding: 2px 9px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .line { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Detalhe */
  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--bg); z-index: 11; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.7,.2,1); display: flex; flex-direction: column; box-shadow: -10px 0 40px var(--shadow); }
  .sheet.on { transform: none; }
  @media (max-width: 700px) { .sheet { top: auto; width: 100%; max-height: 92dvh; border-radius: 22px 22px 0 0; transform: translateY(100%); } }
  .sheet .head { display: flex; justify-content: space-between; align-items: flex-start; padding: 22px 22px 6px; gap: 12px; }
  .sheet h3 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .sheet .since { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .x { appearance: none; border: 0; background: var(--col); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
  .sheet .body { overflow-y: auto; padding: 8px 22px max(24px, env(safe-area-inset-bottom)); }
  dl { margin: 10px 0 0; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row dt { color: var(--muted); flex: none; max-width: 45%; }
  .row dd { min-width: 0; }
  .row dd { margin: 0; text-align: right; font-weight: 500; word-break: break-word; }
  .row a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--underline); }
  .sec { font-size: 12px; color: var(--muted); margin: 24px 0 10px; }
  .moves { display: flex; flex-wrap: wrap; gap: 8px; }
  .move { appearance: none; cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 30px; padding: 9px 14px; font-size: 13px; font-weight: 500; color: var(--ink); }
  .move.cur { background: var(--dark); border-color: var(--dark); color: var(--on-dark); cursor: default; }
  textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; font: inherit; font-size: 14px; outline: 0; background: transparent; color: var(--ink); }
  textarea:focus { border-color: var(--ink); }
  .saved { font-size: 12px; color: var(--muted); height: 16px; margin-top: 6px; }
  .quick { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .quick a.primary { background: var(--dark); border-color: var(--dark); color: var(--on-dark); }
  .quick a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 30px; padding: 9px 14px; font-size: 13px; font-weight: 500; }
  .del { margin-top: 28px; color: var(--error); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--dark); color: var(--on-dark); font-size: 13px; padding: 10px 16px; border-radius: 30px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>

<section class="login" id="login">
  <span class="logo" style="margin-bottom:14px"></span>
  <div class="badge">Membros por convocação</div>
  <h1>Aplicações</h1>
  <p id="login-text">Entre com o seu e-mail de admin do The Group. Mandamos um código de 6 dígitos.</p>
  <form id="f-email">
    <div class="input"><input id="email" type="email" autocomplete="email" autocapitalize="none" placeholder="seu e-mail" required></div>
    <button class="btn" style="width:100%">Receber código</button>
  </form>
  <form id="f-code" style="display:none">
    <div class="input"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required style="letter-spacing:6px;text-align:center"></div>
    <button class="btn" style="width:100%">Entrar</button>
    <button type="button" class="link" id="other">Usar outro e-mail</button>
  </form>
  <div class="msg" id="login-msg"></div>
</section>

<section class="app" id="app">
  <div class="top">
    <div style="display:flex;align-items:center;gap:14px"><span class="logo"></span><h1>Aplicações</h1></div>
    <div class="right">
      <button class="link" style="margin:0" id="refresh">Atualizar</button>
      <button class="link" style="margin:0" id="logout">Sair</button>
    </div>
  </div>
  <div class="board" id="board"></div>
</section>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="head">
    <div><h3 id="d-name"></h3><div class="since" id="d-since"></div></div>
    <button class="x" id="close" aria-label="Fechar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="body">
    <div class="quick" id="d-quick"></div>
    <dl id="d-list"></dl>
    <div class="sec">Mover para</div>
    <div class="moves" id="d-moves"></div>
    <div class="sec">Anotações</div>
    <textarea id="d-nota" placeholder="O que conversaram, próximos passos…" maxlength="2000"></textarea>
    <div class="saved" id="d-saved"></div>
    <button class="link del" id="d-del">Apagar aplicação</button>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  const URL_ = 'https://kqucpivagntlmukfghhg.supabase.co';
  const KEY = 'sb_publishable_yFxha4btvFg2bftRPaPhTA_kZgUNhAV';
  const STORE = 'tg-painel-sessao';
  const CAL_URL = 'https://cal.com/kayoan-felipe-guadagnini-owjodt/30min';
  const COLS = [
    ['nova', 'Novas aplicações'],
    ['conversa', 'Em conversa'],
    ['call', 'Call marcada'],
    ['aprovado', 'Selecionado'],
    ['recusado', 'Não selecionado'],
  ];
  const FUNCAO = { dono: 'Dono de operação', head: 'Head de operação', copywriter: 'Copywriter', trafego: 'Gestor de tráfego', outra: 'Outra função' };
  const NICHO = { nutra: 'Nutracêuticos', info: 'Infoprodutos', saas: 'SaaS e apps', outro: 'Outro' };
  const CANAL = { indicacao: 'Indicação', instagram: 'Instagram', evento: 'Evento', outro: 'Outro caminho' };
  const FAT = { '6': '6 dígitos+ (R$ 100 mil+)', '7': '7 dígitos+ (R$ 1 milhão+)', '8': '8 dígitos+ (R$ 10 milhões+)' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let session = null, rows = [], openId = null;
  try { session = JSON.parse(localStorage.getItem(STORE)); } catch {}
  const save = s => { session = s; try { s ? localStorage.setItem(STORE, JSON.stringify(s)) : localStorage.removeItem(STORE); } catch {} };

  const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); };

  async function auth(path, body) {
    const r = await fetch(`${URL_}/auth/v1/${path}`, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'Erro');
    return j;
  }
  const keep = j => save({ access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in - 60) * 1000 });

  async function token() {
    if (!session) throw new Error('auth');
    if (Date.now() > session.exp) {
      try { keep(await auth('token?grant_type=refresh_token', { refresh_token: session.refresh })); }
      catch { save(null); throw new Error('auth'); }
    }
    return session.access;
  }

  async function api(path, opts = {}) {
    const t = await token();
    const r = await fetch(`${URL_}/rest/v1/${path}`, { ...opts, headers: { apikey: KEY, Authorization: `Bearer ${t}`, 'Content-Type': 'application/json', Prefer: 'return=representation', ...(opts.headers || {}) } });
    if (r.status === 401) { save(null); throw new Error('auth'); }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || 'Erro');
    return r.status === 204 ? null : r.json();
  }

  // Entrada
  let loginEmail = '';
  $('#f-email').addEventListener('submit', async e => {
    e.preventDefault(); $('#login-msg').textContent = '';
    const b = e.submitter; b.disabled = true;
    loginEmail = $('#email').value.trim().toLowerCase();
    try {
      await auth('otp', { email: loginEmail, create_user: false });
      $('#f-email').style.display = 'none'; $('#f-code').style.display = '';
      $('#login-text').textContent = `Digite o código que chegou em ${loginEmail}.`;
      $('#code').focus();
    } catch { $('#login-msg').textContent = 'Não foi possível mandar o código para esse e-mail.'; }
    b.disabled = false;
  });
  $('#f-code').addEventListener('submit', async e => {
    e.preventDefault(); $('#login-msg').textContent = '';
    const b = e.submitter; b.disabled = true;
    try {
      keep(await auth('verify', { type: 'email', email: loginEmail, token: $('#code').value.trim() }));
      await start();
    } catch { $('#login-msg').textContent = 'Código inválido ou vencido.'; }
    b.disabled = false;
  });
  $('#other').addEventListener('click', () => { $('#f-code').style.display = 'none'; $('#f-email').style.display = ''; $('#login-text').textContent = 'Entre com o seu e-mail de admin do The Group. Mandamos um código de 6 dígitos.'; });
  $('#logout').addEventListener('click', () => { save(null); showLogin(); });

  function showLogin() { $('#app').classList.remove('on'); $('#login').classList.add('on'); }

  async function load() {
    rows = await api('aplicacoes?select=*&order=created_at.desc');
    render();
  }

  async function start() {
    try {
      await load();
      $('#login').classList.remove('on'); $('#app').classList.add('on');
      if (!rows.length) {
        // Pode ser um e-mail sem permissão de admin: a tabela simplesmente volta vazia.
      }
    } catch (e) {
      showLogin();
      if (e.message !== 'auth') $('#login-msg').textContent = 'Não foi possível abrir as aplicações.';
    }
  }

  const when = iso => {
    const d = new Date(iso), now = new Date();
    const days = Math.floor((now - d) / 864e5);
    if (days < 1 && d.getDate() === now.getDate()) return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    if (days < 7) return days <= 1 ? 'ontem' : `${days} dias`;
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
  };
  const phone = w => {
    const m = /^\+55(\d{2})(\d{4,5})(\d{4})$/.exec(w);
    return m ? `(${m[1]}) ${m[2]}-${m[3]}` : w;
  };

  function render() {
    $('#board').innerHTML = COLS.map(([k, label]) => {
      const list = rows.filter(r => r.status === k);
      return `<section class="col" data-col="${k}">
        <header><h2>${label}</h2><span class="n">${list.length}</span></header>
        <div class="cards">${list.length ? list.map(r => `
          <button class="card" draggable="true" data-id="${r.id}">
            <div class="name"><span>${esc(r.nome)}</span><span class="when">${when(r.created_at)}</span></div>
            <div class="line">${esc(r.email)}</div>
            <div class="line">${esc(phone(r.whatsapp))}</div>
            ${r.canal === 'indicacao' ? `<div class="tag">Indicação de ${esc(r.indicado_por || 'membro')}</div>` : ''}
          </button>`).join('') : '<div class="empty">Nada por aqui</div>'}</div>
      </section>`;
    }).join('');
    if (openId) fill(rows.find(r => r.id === openId));
  }

  // Arrastar entre colunas (computador)
  let dragId = null;
  const board = $('#board');
  board.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
  board.addEventListener('dragend', e => { e.target.closest('.card')?.classList.remove('dragging'); document.querySelectorAll('.col.drop').forEach(c => c.classList.remove('drop')); });
  board.addEventListener('dragover', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.col.drop').forEach(c => c !== col && c.classList.remove('drop')); col.classList.add('drop'); });
  board.addEventListener('drop', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); col.classList.remove('drop'); move(dragId, col.dataset.col); dragId = null; });
  board.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) open(c.dataset.id); });

  async function move(id, status) {
    const r = rows.find(x => x.id === id);
    if (!r || r.status === status) return;
    const before = r.status; r.status = status; render();
    try { await api(`aplicacoes?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ status }) }); toast(`Movido para ${COLS.find(c => c[0] === status)[1]}`); }
    catch (e) { r.status = before; render(); toast(e.message === 'auth' ? 'Entre de novo' : 'Não foi possível mover'); if (e.message === 'auth') showLogin(); }
  }

  // Detalhe
  function open(id) {
    openId = id; fill(rows.find(r => r.id === id));
    $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); $('#sheet').setAttribute('aria-hidden', 'false');
  }
  function close() { openId = null; $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); $('#sheet').setAttribute('aria-hidden', 'true'); }
  $('#close').addEventListener('click', close);
  $('#scrim').addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  function fill(r) {
    if (!r) { close(); return; }
    $('#d-name').textContent = r.nome;
    const d = new Date(r.created_at);
    $('#d-since').textContent = `Aplicou em ${d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })} às ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
    const wa = r.whatsapp.replace(/\D/g, '');
    const cal = new URL(CAL_URL);
    cal.searchParams.set('name', r.nome);
    cal.searchParams.set('email', r.email);
    cal.searchParams.set('attendeePhoneNumber', r.whatsapp);
    cal.searchParams.set('instagram', '@' + r.instagram);
    const convite = `Oi, ${r.nome.split(' ')[0]}. Aqui é o Kayoan, do The Group. Vi a sua aplicação e quero conversar com você. Escolha o melhor horário por aqui: ${cal.toString()}`;
    $('#d-quick').innerHTML = `
      <a class="primary" href="https://wa.me/${wa}?text=${encodeURIComponent(convite)}" target="_blank" rel="noopener">Chamar para a call</a>
      <a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>
      <a href="https://instagram.com/${encodeURIComponent(r.instagram)}" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:${esc(r.email)}">E-mail</a>`;
    const items = [
      ['Atua com resposta direta', 'Sim'],
      ['Função', r.funcao === 'outra' && r.funcao_outra ? r.funcao_outra : (FUNCAO[r.funcao] || r.funcao)],
      ['Mercado', NICHO[r.nicho] || r.nicho || '-'],
      ['Faturamento por mês', FAT[r.faturamento] || r.faturamento],
      ['Como chegou', r.canal === 'indicacao' && r.indicado_por ? `Indicação de ${r.indicado_por}` : (CANAL[r.canal] || r.canal || '-')],
      ['Instagram', `<a href="https://instagram.com/${encodeURIComponent(r.instagram)}" target="_blank" rel="noopener">@${esc(r.instagram)}</a>`, true],
      ['WhatsApp', `<a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(phone(r.whatsapp))}</a>`, true],
      ['E-mail', `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`, true],
      ['Veio pelo', r.origem === 'app' ? 'App' : r.origem === 'site' ? 'Site' : 'Outro'],
    ];
    $('#d-list').innerHTML = items.map(([k, v, html]) => `<div class="row"><dt>${k}</dt><dd>${html ? v : esc(v)}</dd></div>`).join('');
    $('#d-moves').innerHTML = COLS.map(([k, l]) => `<button class="move${r.status === k ? ' cur' : ''}" data-to="${k}">${l}</button>`).join('');
    if (document.activeElement !== $('#d-nota')) $('#d-nota').value = r.nota || '';
  }
  $('#d-moves').addEventListener('click', e => { const b = e.target.closest('.move'); if (b && openId) move(openId, b.dataset.to); });

  let notaT;
  $('#d-nota').addEventListener('input', () => {
    clearTimeout(notaT); $('#d-saved').textContent = '';
    const id = openId, nota = $('#d-nota').value;
    notaT = setTimeout(async () => {
      try { await api(`aplicacoes?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ nota: nota || null }) }); const r = rows.find(x => x.id === id); if (r) r.nota = nota; $('#d-saved').textContent = 'Salvo'; }
      catch { $('#d-saved').textContent = 'Não foi possível salvar'; }
    }, 700);
  });

  $('#d-del').addEventListener('click', async () => {
    const r = rows.find(x => x.id === openId); if (!r) return;
    if (!confirm(`Apagar a aplicação de ${r.nome}? Não dá para desfazer.`)) return;
    try { await api(`aplicacoes?id=eq.${r.id}`, { method: 'DELETE' }); rows = rows.filter(x => x.id !== r.id); close(); render(); toast('Aplicação apagada'); }
    catch { toast('Não foi possível apagar'); }
  });

  $('#refresh').addEventListener('click', () => load().then(() => toast('Atualizado')).catch(() => toast('Não foi possível atualizar')));
  setInterval(() => { if (session && !document.hidden && !openId) load().catch(() => {}); }, 60000);

  if (session) start(); else showLogin();
})();
</script>
</body>
</html>
